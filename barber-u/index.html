<!doctype html>
<html lang="ja">
<head>

<meta name="description" content="Barber studio u.（武蔵新城）のWeb予約ページです。">

<style>
  html, body { margin: 0; height: 100%; background: #f5f2ec; }

</style>
</head>
<body>
<iframe id="app" title="Barber studio u. ご予約" allow="clipboard-write; web-share"></iframe>
<script>

  var mode = new URLSearchParams(location.search).get('mode') || '';
  var titles = { admin: '予約台帳', cancel: 'ご予約のキャンセル', privacy: 'プライバシーポリシー', sb: 'サロンボード反映' };
  if (titles[mode]) {
    document.title = titles[mode] + '｜Barber studio u.';
    var robots = document.createElement('meta');
    robots.name = 'robots'; robots.content = 'noindex, nofollow';
    document.head.appendChild(robots);
  }
  document.getElementById('app').src = APP + location.search;
</script>
</body>
</html>
